# Take a release and augment it
# build and check the code, add built artifacts to the release, and publish a Docker image

name: Publish Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name'
        required: true

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract_tag.outputs.tag }}
      release_id: ${{ steps.release_info.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release exists
        id: release_info
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          release_json=$(gh api /repos/${{ github.repository }}/releases/tags/${{ github.event.inputs.tag }})
          echo "release_id=$(echo "$release_json" | jq -r '.id')" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: extract_tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Node (optional)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install
      - run: pnpm run build

      - name: Archive frontend build output
        run: |
          tar -czf frontend-build.tar.gz -C dist .

      - name: Upload build artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend-build.tar.gz
          tag_name: ${{ needs.ci.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR variables
        run: |
          echo "ECR_REGISTRY=$(aws sts get-caller-identity --query 'Account' --output text).dkr.ecr.eu-west-2.amazonaws.com" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=galv-frontend" >> $GITHUB_ENV

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.extract_tag.outputs.tag }}
            type=raw,value=latest

      - name: Build and push image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  append-ci-status:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish the release
        if: success()
        run: |
          tag="${{ github.event.release.tag_name }}"

          # Safely append CI failure notice to body with markdown preserved
          body=$(cat <<EOF
          ${{ github.event.release.body }}
    
          ---
    
          ✅ CI passed. Docker image has been pushed to ECR and the frontend build has been uploaded.
          EOF
          )
      
          gh release edit "$tag" --notes "$body"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark release as failed
        if: failure()
        run: |
          tag="${{ github.event.release.tag_name }}"
          title="${{ github.event.release.name }}"

          # Prefix 🚫 if not already present
          if [[ "$title" == 🚫* ]]; then
            exit 0
          fi

          # Safely append CI failure notice to body with markdown preserved
          body=$(cat <<EOF
          ${{ github.event.release.body }}
    
          ---
    
          🚨 **CI failed**: This release remains incomplete. Artifacts may be missing or broken.
          EOF
          )
      
          gh release edit "$tag" --title "$title" --notes "$body"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
